name: IntercomListener

options:
  bundleIdPrefix: com.intercomlistener
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

# Local code-signing lives in a gitignored xcconfig so a personal Apple Developer
# Team ID never lands in the committed spec.  Applied project-wide (all targets
# inherit DEVELOPMENT_TEAM).  Forkers: copy Signing.xcconfig.example to
# Signing.xcconfig and set their own team.  If the file is absent, generation
# still succeeds — device builds just won't auto-sign until it's created.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

# Explicit schemes.  Declaring them turns off XcodeGen's per-target
# auto-generation, which otherwise creates a scheme only for the widget
# extension — running that fails with "Failed to get descriptors for
# extensionBundleID".  We expose one scheme per runnable app (iOS + watchOS);
# the widget extension is built/embedded automatically by the app scheme.
schemes:
  IntercomListener:
    build:
      targets:
        IntercomListener: all
      parallelizeBuild: true
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  IntercomListenerWatch:
    build:
      targets:
        IntercomListenerWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:

  IntercomListener:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
      - path: Sources/LiveActivity
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Intercom
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Used to talk through intercom panels on your local network.
        NSLocalNetworkUsageDescription: Connects directly to intercom panels on your local network.
        NSBonjourServices: [_intercom-tcp._tcp]
    entitlements:
      path: Sources/iOS/IntercomListener.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: IntercomWidgets
        embed: true
      - target: IntercomListenerWatch
        embed: true

  IntercomWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widgets
      - path: Sources/LiveActivity
    info:
      path: Sources/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Intercom
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  IntercomListenerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/watchOS
      - path: Sources/Shared
    info:
      path: Sources/watchOS/Info.plist
      properties:
        CFBundleDisplayName: Intercom
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        NSMicrophoneUsageDescription: Used to talk through intercom panels on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
